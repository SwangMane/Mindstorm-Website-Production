<!DOCTYPE html>
<html lang="en" class="fira-sans-regular">

<!--******************************
 ***                           ***
 ***        INDEX PAGE         ***
 ***                           ***
 ***************************** -->

<!-- HEAD HEAD HEAD -->
  <head>

    <!-- Page title -->
    <title>Mindstorm | Home</title>	

    <!-- Viewport / character encoding -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Site author -->
    <meta name="author" content="DARKminerKS">

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <!-- External stylesheets -->
    <link rel="stylesheet" href="style_main.css">
    <link rel="stylesheet" href="style_mobile.css">
    <link rel="stylesheet" href="style_root.css">

    <!-- Imported fonts -->
    <!-- Press start 20 (Pixel Text) | Basic (Std text, thicker) | Mozilla text (basic text, thinner) | Story script (cursive-ish, nice look) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Basic&family=Cinzel:wght@400..900&family=Fira+Sans:wght@100;400;700&family=Press+Start+2P&family=Story+Script&display=swap" rel="stylesheet">

  </head>
<!-- /HEAD /HEAD /HEAD -->

<!-- BODY BODY BODY --> 
  <body id="admin"> <!-- ID'D -->

    <!-- BACKGROUND ELEMENTS -->
    <div id="page_bcg_1" class="page_background fill_space no_space"></div> <!-- starts visible --> <!-- ID'D -->
    <div id="page_bcg_2" class="page_background fill_space no_space"></div> <!-- starts hidden --> <!-- ID'D -->

    <!-- HEADER HEADER HEADER -->
    <header class="flexed">

      <!-- SERVER STATUS ICON | online = green circle | offline = red circle -->
      <p>Server Status <span id="server_status_icon"></span></p> <!-- ID'D -->

      <!-- NAV ELEMENT -->
      <nav>

        <!-- NAV BAR-->
        <ul id="navbar_list"> <!-- ID'D -->

        </ul>
        <!-- /NAV BAR -->

      </nav>
      <!-- /NAV ELEMENT -->

      <!-- NAV TITLE ELEMENT | Only visible UNDER 960px screen width -->
      <div class="nav_title yellow_gradient_txt centered column">
        <h1 class="no_space centered_text cinzel-bold">Mindstorm</h1>
        <h2 class="no_space centered_text">A minecraft community</h2>
      </div> <!-- /NAV TITLE -->

      <!-- NAV TOGGLE BUTTON | Only visible UNDER 960px screen width -->
      <button class="nav_toggle" aria-expanded="false" aria-controls="navbar_list">☰</button>

    </header>
    <!-- /HEADER /HEADER /HEADER -->


    <!-- MAIN MAIN MAIN -->
    <main class="flexed centered column">

      <div class="wrapper_outer centered max_1280 flexed column">

        <p class="centered_text flexed green_gradient_bcg offWhite_text flexed">Admin page</p>

        <div class="flexed grayer_gradient_bcg column">
          <label for="delete_user_input">Delete user from website (Type users Minecraft ID and click delete - Very dangerous)</label>
          <div class="flexed grayer_gradient_bcg">
            <input id="delete_user_input" type="text" placeholder="Enter Minecraft username">
            <button id="delete_user_btn">Delete User</button>
          </div>
        </div>

        <div class="flexed grayer_gradient_bcg column">
          <label for="give_user_coins">Give specific user coins (Type users Minecraft ID and click give coins)</label>
          <div class="flexed grayer_gradient_bcg">
            <input id="give_user_coins" type="text" placeholder="Enter Minecraft username">
            <input id="give_user_coins_amount" type="text" placeholder="Enter Coin Amount">
            <button id="give_user_coins_btn">Give Coins</button>
          </div>
        </div>

        <div class="flexed grayer_gradient_bcg column">
          <label for="delete_user_input">Change your server role (Warning --- This could lock you out of certain features)</label>
          <div class="flexed grayer_gradient_bcg">
            <select id="admin_page_roleuserList"></select>
            <select id="admin_page_roleSelect" class="flexed fira-sans-bold">
              <option value="Default" selected disabled>Select Role</option>
              <option value="Standard User">Standard user</option>
              <option value="Moderator">Moderator</option>
              <option value="Owner">Owner</option>
            </select>
            <button id="save_user_role" disabled>Save Role</button>
          </div>
        </div>

      </div>


    </main>
    <!-- /MAIN /MAIN /MAIN -->


    <!-- FOOTER ELEMENT | SAME ON ALL PAGES -->
    <footer class="flexed centered offWhite_text">
      
    </footer>

    <!-- ALL SCRIPTS -->
    <script type="module" src="script_main.js"></script>
    <script src="https://mcapi.us/scripts/minecraft.min.js"></script>

  </body>
<!-- /BODY /BODY /BODY -->

</html>
